<ion-content>
  <div class="app-page">
    <section class="page-intro" aria-labelledby="favourite-list-title">
      <p class="page-eyebrow">Your collection</p>
      <h1 id="favourite-list-title" class="page-title">Favourite Pokémon.</h1>
      <p class="page-description">
        Keep the Pokémon you love in one place and return to their details whenever you like.
      </p>
    </section>

    <section class="placeholder-panel" aria-labelledby="favourite-list-status">
      <img
        class="placeholder-panel__image placeholder-panel__image--empty"
        src="assets/pokemon-error.png"
        width="250"
        height="300"
        alt=""
      />
      <h2 id="favourite-list-status" class="placeholder-panel__title">No favourites yet</h2>
      <p class="placeholder-panel__description">
        Explore the Pokédex and save the Pokémon you want to find quickly later.
      </p>
      <a class="text-link" routerLink="/pokemon">Explore Pokémon</a>
    </section>
  </div>
</ion-content>
